<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Team | PhoenixGBVLab</title>
    <link rel="icon" type="image/png" href="../assets/logos/phoenix_gbv_lab_logo.png" />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="../app.js"></script>
  </head>
  <body data-page="team" data-root="..">
    <div class="site-shell">
      <div data-include="header"></div>

      <main class="page">
        <section class="page-banner">
          <div class="page-title">
            <h1>Our Team</h1>
          </div>
        </section>

        <section class="section">
          <div class="member-grid">
            <article class="member-card featured-member">
              <a class="member-card-link" href="./laura-sinko/">
                <img
                  class="member-photo"
                  src="../assets/team_photos/laura-sinko.jpg"
                  alt="Laura Sinko"
                />
                <div>
                  <h3 class="member-name">Laura Sinko</h3>
                  <p class="member-role">Principal Investigator</p>
                </div>
                <p class="member-summary">View profile</p>
              </a>
            </article>

            <article class="member-card featured-member">
              <a class="member-card-link" href="./kayleigh-izzo/">
                <img
                  class="member-photo"
                  src="../assets/team_photos/kayleigh-izzo.jpg"
                  alt="Kayleigh Izzo"
                />
                <div>
                  <h3 class="member-name">Kayleigh Izzo</h3>
                  <p class="member-role">Research Associate</p>
                </div>
                <p class="member-summary">View profile</p>
              </a>
            </article>
          </div>
        </section>
      </main>

      <div data-include="footer"></div>
    </div>
  </body>
</html>
